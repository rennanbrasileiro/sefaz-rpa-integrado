name: RPA GCE Windows installer validation

on:
  pull_request:
    paths:
      - 'ci/rpa-gce-v5.3.0-source.part*'
      - 'ci/rpa-gce-v5.3.0-repair*'
      - '.github/workflows/rpa-gce-windows-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Reconstruct and verify exact source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ci = Join-Path $env:GITHUB_WORKSPACE 'ci'
          $ordered = [System.Collections.Generic.List[string]]::new()
          function Add-Source([int]$n) { $ordered.Add((Join-Path $ci ('rpa-gce-v5.3.0-source.part{0:d2}' -f $n))) }
          function Add-Repair([string]$pattern) { Get-ChildItem $ci -Filter $pattern | Sort-Object Name | ForEach-Object { $ordered.Add($_.FullName) } }

          Add-Source 0
          Add-Repair 'rpa-gce-v5.3.0-repair01.part*'
          Add-Source 2
          Add-Repair 'rpa-gce-v5.3.0-repair03.part*'
          foreach ($n in 4..7) { Add-Source $n }
          Add-Repair 'rpa-gce-v5.3.0-repair08.part*'
          Add-Source 9
          Add-Repair 'rpa-gce-v5.3.0-repair10.fix*'
          $ordered.Add((Join-Path $ci 'rpa-gce-v5.3.0-repair10.part2'))
          foreach ($n in 11..12) { Add-Source $n }
          Add-Repair 'rpa-gce-v5.3.0-repair13.part*'
          foreach ($n in 14..26) { Add-Source $n }
          if ($ordered.Count -ne 36) { throw "Quantidade inesperada de segmentos: $($ordered.Count)." }

          $builder = [System.Text.StringBuilder]::new()
          foreach ($file in $ordered) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Segmento ausente: $file" }
            $text = (Get-Content -LiteralPath $file -Raw).Trim().TrimStart([char]0xFEFF)
            if ([regex]::IsMatch($text, '[^A-Za-z0-9+/=]')) { throw "Segmento Base64 inválido: $file" }
            [void]$builder.Append($text)
          }
          $encoded = $builder.ToString()
          if ($encoded.Length -ne 250480 -or ($encoded.Length % 4) -ne 0) { throw "Base64 reconstruído possui tamanho inválido: $($encoded.Length)." }
          $source = Join-Path $env:RUNNER_TEMP 'rpa-gce-v5.3.0-source.tar.xz'
          [IO.File]::WriteAllBytes($source, [Convert]::FromBase64String($encoded))
          $sourceHash = (Get-FileHash -Algorithm SHA256 $source).Hash.ToLowerInvariant()
          if ($sourceHash -ne '10ec1b05dce8311ea699940c7f6e20293d6201672ba5a537bddc7d9c93fecafb') { throw "Hash do fonte inválido: $sourceHash" }

          $target = Join-Path $env:GITHUB_WORKSPACE 'rpa-gce-v5.3.0'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          & tar.exe -xf $source -C $target
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao extrair o código-fonte.' }
          foreach ($required in @('build-windows.ps1','package.json','main.cjs','preload.cjs','installer\main.go','launcher\main.go')) {
            if (-not (Test-Path (Join-Path $target $required) -PathType Leaf)) { throw "Arquivo-fonte ausente: $required" }
          }
          $pkg = Get-Content (Join-Path $target 'package.json') -Raw | ConvertFrom-Json
          if ($pkg.version -ne '5.3.0') { throw "Versão inesperada: $($pkg.version)" }

      - name: Build self-contained installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE 'rpa-gce-v5.3.0'
          $out = Join-Path $env:GITHUB_WORKSPACE 'out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Set-Location $project
          npm install --no-save --ignore-scripts typescript@5.8.3 tailwindcss@4.1.10
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar ferramentas locais de build.' }

          $buildCssPath = Join-Path $project 'build-css.cjs'
          $buildCss = Get-Content $buildCssPath -Raw
          $oldResolver = "const tailwindLib=resolveTool('tailwindcss/dist/lib.js');"
          $newResolver = "const tailwindPackage=require.resolve('tailwindcss/package.json');`nconst tailwindLib=path.join(path.dirname(tailwindPackage),'dist','lib.js');"
          if (-not $buildCss.Contains($oldResolver)) { throw 'Trecho esperado do resolvedor Tailwind não foi encontrado.' }
          $buildCss = $buildCss.Replace($oldResolver, $newResolver)
          Set-Content -Path $buildCssPath -Value $buildCss -Encoding UTF8

          .\build-windows.ps1 -Output (Join-Path $out 'RPA-GCE-Correios-Instalador-Oficial-5.3.0.exe')

      - name: Validate install launch repair and conflicts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Checked([string]$File, [string[]]$Arguments) {
            $process = Start-Process -FilePath $File -ArgumentList $Arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "$File $($Arguments -join ' ') falhou com código $($process.ExitCode)" }
          }
          $installer = Join-Path $env:GITHUB_WORKSPACE 'out\RPA-GCE-Correios-Instalador-Oficial-5.3.0.exe'
          if (-not (Test-Path $installer -PathType Leaf)) { throw 'Instalador não foi gerado.' }
          $testRoot = Join-Path $env:RUNNER_TEMP 'rpa-gce-windows-e2e'
          if (Test-Path $testRoot) { Remove-Item $testRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          $env:LOCALAPPDATA = Join-Path $testRoot 'LocalAppData'
          $env:RPA_GCE_INSTALL_DIR = Join-Path $testRoot 'Installed'
          $env:RPA_GCE_SILENT_ERRORS = '1'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA,$env:RPA_GCE_INSTALL_DIR | Out-Null

          $marker = Join-Path $testRoot 'browser-open.txt'
          $probe = Join-Path $testRoot 'browser-probe.cmd'
          @('@echo off','> "%RPA_GCE_BROWSER_MARKER%" echo %~1') | Set-Content -Path $probe -Encoding ASCII
          $env:RPA_GCE_BROWSER_MARKER = $marker
          $env:RPA_GCE_BROWSER_COMMAND = $probe

          $lock = Join-Path $env:LOCALAPPDATA 'RPA-GCE-Correios-v5.lock'
          [ordered]@{pid=$PID;port=65520;url='http://127.0.0.1:65520';version='5.3.0';instanceId='stale-live-pid'} | ConvertTo-Json -Compress | Set-Content $lock -Encoding UTF8
          Invoke-Checked $installer @('--verify-install-and-launch')

          $launcher = Join-Path $env:RPA_GCE_INSTALL_DIR 'RPA GCE Correios 5.3.0.exe'
          $node = Join-Path $env:RPA_GCE_INSTALL_DIR 'runtime\5.3.0\node\node.exe'
          $main = Join-Path $env:RPA_GCE_INSTALL_DIR 'app-5.3.0\main.cjs'
          foreach ($required in @($launcher,$node,$main,$marker)) { if (-not (Test-Path $required -PathType Leaf)) { throw "Ausente após instalar: $required" } }
          $openedUrl = (Get-Content $marker -Raw).Trim()
          if ($openedUrl -notmatch '^http://127\.0\.0\.1:\d+$') { throw "Navegador não recebeu URL válida: $openedUrl" }
          $health = Invoke-RestMethod -Uri "$openedUrl/health" -TimeoutSec 10
          if (-not $health.ok -or -not $health.ui -or $health.version -ne '5.3.0') { throw "Health inválido: $($health | ConvertTo-Json -Compress)" }
          $html = Invoke-WebRequest -UseBasicParsing -Uri "$openedUrl/index.html" -TimeoutSec 10
          $js = Invoke-WebRequest -UseBasicParsing -Uri "$openedUrl/assets/app.js" -TimeoutSec 10
          if ($html.StatusCode -ne 200 -or $html.Content -notmatch 'startup-fallback') { throw 'HTML instalado inválido.' }
          if ($js.StatusCode -ne 200 -or $js.Content -notmatch 'ReactDOM.createRoot') { throw 'Bundle instalado inválido.' }
          Invoke-RestMethod -Method Post -Uri "$openedUrl/api/close" -TimeoutSec 10 | Out-Null
          Start-Sleep -Seconds 2

          Invoke-Checked $installer @('--silent-install')
          Invoke-Checked $installer @('--silent-install')
          Invoke-Checked $launcher @('--self-check')
          Invoke-Checked $launcher @('--probe-start')

          $conflictRoot = Join-Path $testRoot 'ConflictInstall'
          New-Item -ItemType Directory -Force -Path $conflictRoot | Out-Null
          Set-Content (Join-Path $conflictRoot 'runtime') 'arquivo conflitante' -Encoding UTF8
          Set-Content (Join-Path $conflictRoot 'app-5.3.0') 'arquivo conflitante' -Encoding UTF8
          $env:RPA_GCE_INSTALL_DIR = $conflictRoot
          Invoke-Checked $installer @('--silent-install')
          if (-not (Get-ChildItem $conflictRoot -Filter 'runtime.conflito-*' -File -ErrorAction SilentlyContinue)) { throw 'Conflito runtime não foi reparado.' }
          if (-not (Get-ChildItem $conflictRoot -Filter 'app-5.3.0.conflito-*' -File -ErrorAction SilentlyContinue)) { throw 'Conflito app não foi reparado.' }
          $conflictLauncher = Join-Path $conflictRoot 'RPA GCE Correios 5.3.0.exe'
          Invoke-Checked $conflictLauncher @('--self-check')
          Invoke-Checked $conflictLauncher @('--probe-start')

          [ordered]@{
            validatedAt=(Get-Date).ToUniversalTime().ToString('o')
            installer=(Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
            installAndLaunch=$true
            browserUrlOpened=$openedUrl
            healthVersion=$health.version
            staleLivePidLockRecovered=$true
            repeatInstall=$true
            existingPathConflictsRecovered=$true
            embeddedNode=(& $node --version).Trim()
          } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'out\WINDOWS-E2E-RESULT.json') -Encoding UTF8
          Get-ChildItem $testRoot -Filter '*.log' -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination (Join-Path $env:GITHUB_WORKSPACE 'out') -Force

      - name: Upload validated installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpa-gce-windows-5.3.0
          path: |
            out/RPA-GCE-Correios-Instalador-Oficial-5.3.0.exe
            out/SHA256-RPA-GCE-V5.3.0.txt
            out/WINDOWS-E2E-RESULT.json
            out/*.log
          if-no-files-found: warn
          retention-days: 7
